x-python-service: &python-service
  build:
    context: ./services/python
    dockerfile: Dockerfile
  env_file: .env
  restart: unless-stopped
  working_dir: /app
  depends_on:
    postgres:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=*"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=5GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "log_min_duration_statement=1000"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aifinance}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ingest:
    <<: *python-service
    command: ["python", "scripts/ingest_candles.py"]

  scanner-short:
    <<: *python-service
    command: ["python", "scripts/live_scanner_v2.py"]

  scanner-long:
    <<: *python-service
    command: ["python", "scripts/live_scanner_long_v2.py"]

  # D1e scanner (Phase 17 locked, SHORT-only) — feeds the 4 D1e×{S,E} paper
  # accounts. Writes to scanner_signals_d1e with v4 classifier scores attached.
  scanner-d1e:
    <<: *python-service
    command: ["python", "scripts/live_scanner_d1e.py"]

  # v8 scanner — Week 8 BALANCED stack, first detector deployed:
  # macd_pullback_short_e2 (5/6 ship gates, wf_p5 2.102 — strongest single
  # config in v5/v8 effort). Feeds scanner_signals_macd_pullback_short.
  # Other v8 detectors ship in follow-up PRs after 7-14d paper validation.
  scanner-v8-macd-pullback-short:
    <<: *python-service
    command: ["python", "scripts/live_scanner_macd_pullback_short.py"]

  paper:
    <<: *python-service
    command: ["python", "scripts/paper_executor.py"]

volumes:
  postgres_data:
