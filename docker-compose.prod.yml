x-python-service: &python-service
  build:
    context: ./services/python
    dockerfile: Dockerfile
  env_file: .env
  restart: unless-stopped
  working_dir: /app
  depends_on:
    postgres:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=*"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=5GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "log_min_duration_statement=1000"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aifinance}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ingest:
    <<: *python-service
    command: ["python", "scripts/ingest_candles.py"]

  scanner-short:
    <<: *python-service
    command: ["python", "scripts/live_scanner_v2.py"]

  scanner-long:
    <<: *python-service
    command: ["python", "scripts/live_scanner_long_v2.py"]

  paper:
    <<: *python-service
    command: ["python", "scripts/paper_executor.py"]

volumes:
  postgres_data:
