[project]
name = "ai-finance-python"
version = "0.1.0"
description = "Crypto trading ML engine and data pipeline"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "ccxt>=4.0.0",
    "pycoingecko>=3.1.0",
    "apscheduler>=3.10.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "lightgbm>=4.5.0",
    "joblib>=1.4.0",
    "pyarrow>=15.0.0",
    "transformers>=5.7.0",
    "huggingface-hub>=1.12.2",
    "einops>=0.8.2",
    "safetensors>=0.7.0",
]

[project.optional-dependencies]
ml-train = [
    "torch>=2.4.0",
    "gymnasium>=0.29.0",
    "optuna>=3.6.0",
    "shap>=0.46.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest-cov>=6.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/ml/**" = ["N803", "N806"]  # Allow uppercase X for ML convention (X_train, X_val, etc.)
"src/rl/**" = ["N803", "N806"]
"tests/test_*" = ["N803", "N806"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
